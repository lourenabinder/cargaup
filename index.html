
<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga Up – Evolua a Cada Treino</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f4f4f9;
  --card-bg:#ffffff;
  --text:#1e1e1e;
  --red:#1565c0;
  --red-light:#bbdefb;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:2rem;
}

h1{text-align:center;font-size:2rem;margin-bottom:0.5rem;}
p.slogan{text-align:center;font-size:1rem;color:#555;margin-bottom:1.5rem;}

/* estilo do campo de busca (igual aos inputs existentes) */
#searchInput{
  width:100%;
  padding:0.6rem;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:0.3rem;
  background:#f9f9f9;
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
}

#searchResults{
  list-style:none;
  margin-top:0.5rem;
  padding-left:0;
}

.search-card{
  background:#fff;
  padding:0.6rem;
  border-radius:8px;
  margin-bottom:0.5rem;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
}

section{max-width:900px;margin:1rem auto;}

input, select, button, textarea{
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
}

input, select, textarea{
  width:100%;
  padding:0.6rem;
  border-radius:8px;
  border:1px solid #ccc;
  margin-top:0.3rem;
  background:#f9f9f9;
}

textarea{resize:vertical;min-height:50px;}

button{
  border:none;
  border-radius:10px;
  padding:0.6rem 1rem;
  cursor:pointer;
  font-weight:600;
  background:var(--red);
  color:#fff;
  transition:transform 0.2s ease,background 0.2s;
}

button:hover{
  transform:scale(1.05);
  background:#0d47a1;
}

.accordion-item{
  background:var(--card-bg);
  border-radius:14px;
  margin-bottom:1rem;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  overflow:hidden;
}

.accordion-header{
  padding:1rem 1.25rem;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
  font-size:1.1rem;
  background:#e9e9f0;
}

.exercise-list{
  list-style:none;
  padding-left:0;
  margin-top:0.5rem;
}

.exercise-list li{
  background:#fefefe;
  margin-bottom:0.5rem;
  padding:0.8rem;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.exercise-list li.done{
  background:var(--red-light);
}

.exercise-info{
  margin-top:0.3rem;
  font-size:0.9rem;
  color:#555;
}

.loads-list{
  list-style:disc;
  margin-left:1.5rem;
  margin-top:0.3rem;
}

.exercise-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:0.5rem;
  margin-top:0.6rem;
}

.exercise-buttons button{
  flex:1;
  font-size:0.85rem;
  padding:0.6rem;
}

.edit-menu{
  display:none;
  flex-direction:column;
  gap:0.3rem;
  margin-top:0.3rem;
}

.edit-menu button{
  font-size:0.8rem;
  padding:0.3rem;
  background:var(--red);
}

.reset-treino{
  background:transparent;
  border:none;
  color:var(--red);
  font-size:1.1rem;
  cursor:pointer;
  width: 40px;
  height: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
}

.alert{
  position:fixed;
  top:1rem;
  left:50%;
  transform:translateX(-50%);
  background:var(--red);
  color:#fff;
  padding:0.75rem 1.25rem;
  border-radius:8px;
  opacity:0;
  transition:opacity 0.3s ease;
}

.alert.show{opacity:1;}

.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
  visibility:hidden;
  opacity:0;
  transition:opacity 0.3s ease;
}

.modal.show{
  visibility:visible;
  opacity:1;
}

.modal-content{
  background:#fff;
  padding:1.5rem;
  border-radius:12px;
  max-width:400px;
  width:90%;
  box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.modal-content h3{
  margin-bottom:1rem;
  text-align:center;
}

.modal-buttons{
  display:flex;
  justify-content:space-between;
  margin-top:1rem;
}

.toggle-button {
  width: 40px;
  height: 40px;
  font-size: 1.1rem;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  margin: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--red);
  border: none;
  cursor: pointer;
}

.toggle-button:focus,
.toggle-button:active,
.toggle-button:hover,
.reset-treino:focus,
.reset-treino:active,
.reset-treino:hover {
    background: transparent !important;
    outline: none !important;
    box-shadow: none !important;
}
</style>
</head>
<body>

<h1>🏋️‍♂️ Carga Up – Evolua a Cada Treino</h1>
<p class="slogan">Registre. Evolua. Supere-se.</p>

<!-- campo de busca adicionado (posição 2: abaixo do addExerciseSection) -->
<section id="addExerciseSection">
  <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:0.5rem;">
    <button type="button" id="toggleAddExercise" class="toggle-button">+</button>
  </div>

  <div id="addExerciseContent" style="display:none;">
    <label>Selecione um exercício:</label>
    <select id="exerciseSelect">
      <option value="">Selecione...</option>
      <option value="add">+ Adicionar novo exercício</option>
    </select>

    <div id="newExerciseDiv" style="display:none;">
      <input id="exerciseInput" placeholder="Digite o nome do novo exercício">
    </div>

    <label>Treino:</label>
    <select id="selectTreino">
      <option value="A">Treino A</option>
      <option value="B">Treino B</option>
      <option value="C">Treino C</option>
      <option value="D">Treino D</option>
      <option value="E">Treino E</option>
      <option value="F">Treino F</option>
    </select>

    <label>Séries:</label>
    <input type="number" id="series">

    <label>Repetições:</label>
    <input type="text" id="reps">

    <label>Descanso:</label>
    <input type="text" id="rest">

    <button id="addExercise">Adicionar Exercício</button>
  </div>
</section>

<!-- campo de busca exibido logo abaixo da área de adicionar exercício -->
<section style="max-width:900px;margin:0 auto 1rem auto;">
  <input id="searchInput" placeholder="Buscar exercício (nome, treino, carga, obs...)" />
  <ul id="searchResults"></ul>
</section>

<section id="accordion"></section>

<div class="alert" id="alertMsg"></div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>Editar Exercício</h3>

    <label>Nome:</label>
    <input type="text" id="editName">

    <label>Séries:</label>
    <input type="number" id="editSeries">

    <label>Repetições:</label>
    <input type="text" id="editReps">

    <label>Descanso:</label>
    <input type="text" id="editRest">

    <div class="modal-buttons">
      <button id="saveEdit">Salvar</button>
      <button id="cancelEdit">Cancelar</button>
    </div>
  </div>
</div>

<!-- scripts compatíveis (mesma abordagem que você usava) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>
/* =====================
   🔥 INICIALIZAÇÃO FIREBASE
===================== */
const firebaseConfig = {
  apiKey:"AIzaSyDNgm5OMnqx1pFqfyGELMqStfnjeQvQPmM",
  authDomain:"cargaup-b6d65.firebaseapp.com",
  projectId:"cargaup-b6d65",
  storageBucket:"cargaup-b6d65.appspot.com",
  messagingSenderId:"193965502419",
  appId:"1:193965502419:web:181b63fd2f1f8d88c68926"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* =====================
   🔧 VARIÁVEIS GLOBAIS
===================== */
let exercisesData = {};
let exerciseOrder = {};
let doneState = {};  // ← concluídos apenas durante a sessão

const treinos = ['A','B','C','D','E','F'];

const accordion = document.getElementById("accordion");
const alertDiv = document.getElementById("alertMsg");
const editModal = document.getElementById("editModal");

let currentEditExercise = null;
let currentEditTreino = null;

/* =====================
   🔧 INICIAR SISTEMA
===================== */
init();

function init(){
  montarAccordion();
  configurarInterface();
  loadFromFirestore();
}

/* =====================
   🧱 MONTAR ACORDEÃO
===================== */
function montarAccordion(){
  accordion.innerHTML = "";

  treinos.forEach(t => {
    const div = document.createElement("div");
    div.className = "accordion-item";
    div.dataset.treino = t;

    div.innerHTML = `
      <div class="accordion-header">
        Treino ${t}
        <div style="display:flex; gap:0.5rem;">
            <button class="toggle-button">+</button>
            <button class="reset-treino" data-treino="${t}">🔄</button>
        </div>
      </div>

      <ul class="exercise-list" style="display:none;"></ul>
    `;

    accordion.appendChild(div);
  });
}

/* =====================
   🎛 CONFIGURAÇÃO DE EVENTOS
===================== */
function configurarInterface(){

  document.getElementById("toggleAddExercise").addEventListener("click", () => {
    const box = document.getElementById("addExerciseContent");
    const hidden = box.style.display === "none";
    box.style.display = hidden ? "block" : "none";
    document.getElementById("toggleAddExercise").textContent = hidden ? "–" : "+";
  });

  document.getElementById("exerciseSelect").addEventListener("change", e => {
    document.getElementById("newExerciseDiv").style.display =
      e.target.value === "add" ? "block" : "none";
  });

  document.getElementById("addExercise").addEventListener("click", addExercise);

  document.getElementById("cancelEdit").addEventListener("click", () => {
    editModal.classList.remove("show");
  });

  document.getElementById("saveEdit").addEventListener("click", saveEdit);

  accordion.addEventListener("click", handleAccordionClick);

  // salvar observações ao digitar (delegation)
  document.addEventListener("input", function(e){
    if(e.target && e.target.classList && e.target.classList.contains("observation")){
      const li = e.target.closest("li");
      const name = li?.getAttribute("data-name");
      const treinoEl = li?.closest(".accordion-item");
      const treino = treinoEl?.dataset.treino;
      if(name && treino){
        if(!exercisesData[name]) exercisesData[name] = { treinos:{}, loads:[] };
        if(!exercisesData[name].treinos[treino]) exercisesData[name].treinos[treino] = { series:"", reps:"", rest:"", observations:"" };
        exercisesData[name].treinos[treino].observations = e.target.value;
        saveToFirestore();
      }
    }
  });

  // busca
  document.getElementById("searchInput").addEventListener("input", function(){
    const text = this.value.toLowerCase();
    const results = document.getElementById("searchResults");
    results.innerHTML = "";

    if(text.trim() === "") return;

    Object.keys(exercisesData).forEach(name => {
      const exData = exercisesData[name];

      // percorre treinos onde o exercício existe
      Object.keys(exData.treinos || {}).forEach(t => {
        const ex = exData.treinos[t];
        // cargas são armazenadas globalmente em exData.loads (como no seu código original)
        const cargas = Array.isArray(exData.loads) ? exData.loads.join(" • ") : "";

        const fullText = `${name} ${t} ${ex.series} ${ex.reps} ${ex.rest} ${ex.observations || ""} ${cargas}`.toLowerCase();

        if(fullText.includes(text)){
          const li = document.createElement("li");
          li.className = "search-card";

          li.innerHTML = `
            <strong>${name}</strong> — Treino <strong>${t}</strong><br>
            Séries: ${ex.series || "-"} • Reps: ${ex.reps || "-"} • Descanso: ${ex.rest || "-"}<br>
            <em>Cargas:</em> ${cargas || "Nenhuma"}<br>
            <em>Observações:</em> ${ex.observations || "-"}
          `;

          results.appendChild(li);
        }
      });
    });
  });
}

function addExercise(){
  const select = document.getElementById("exerciseSelect");
  const name = select.value === "add"
      ? document.getElementById("exerciseInput").value.trim()
      : select.value;

  const treino = document.getElementById("selectTreino").value;
  const series = document.getElementById("series").value.trim();
  const reps   = document.getElementById("reps").value.trim();
  const rest   = document.getElementById("rest").value.trim();

  if(!name || !series || !reps || !rest){
    alert("Preencha todos os campos");
    return;
  }

  if(!exercisesData[name])
    exercisesData[name] = { treinos:{}, loads:[] };

  if(!exerciseOrder[treino])
    exerciseOrder[treino] = [];

  exercisesData[name].treinos[treino] = {
    series, reps, rest, observations: exercisesData[name].treinos?.[treino]?.observations || ""
  };

  if(!exerciseOrder[treino].includes(name))
    exerciseOrder[treino].push(name);

  document.getElementById("exerciseInput").value = "";
  select.value = "";
  document.getElementById("series").value = "";
  document.getElementById("reps").value = "";
  document.getElementById("rest").value = "";
  document.getElementById("newExerciseDiv").style.display = "none";

  renderExercises();
  saveToFirestore();
}

function saveEdit(){
  const newName = document.getElementById("editName").value.trim();
  const s = document.getElementById("editSeries").value.trim();
  const r = document.getElementById("editReps").value.trim();
  const d = document.getElementById("editRest").value.trim();

  if(!newName || !s || !r || !d){
    alert("Preencha todos os campos");
    return;
  }

  const treino = currentEditTreino;

  if(newName !== currentEditExercise){
    const existingLoads = exercisesData[currentEditExercise]?.loads
      ? [...exercisesData[currentEditExercise].loads] : [];

    if(!exercisesData[newName])
      exercisesData[newName] = { treinos:{}, loads: existingLoads };

    exercisesData[newName].treinos[treino] =
      exercisesData[currentEditExercise].treinos[treino];

    delete exercisesData[currentEditExercise].treinos[treino];

    exerciseOrder[treino] = exerciseOrder[treino].map(
      n => n === currentEditExercise ? newName : n
    );

    currentEditExercise = newName;
  }

  const ex = exercisesData[currentEditExercise].treinos[treino];
  ex.series = s;
  ex.reps   = r;
  ex.rest   = d;

  editModal.classList.remove("show");

  renderExercises();
  saveToFirestore();
}

/* =========================================================
   MANIPULAÇÃO DE CLIQUES – INCLUINDO "CONCLUÍDO" COM doneState
========================================================= */
function handleAccordionClick(e){
  const btn = e.target;

  let li = btn.closest("li");
  if(!li){
    let el = btn;
    while(el && el !== accordion && !el.getAttribute?.('data-name')){
      el = el.parentElement;
    }
    if(el && el.getAttribute && el.getAttribute('data-name')) li = el;
  }

  const treinoDiv = btn.closest(".accordion-item");
  const treino = treinoDiv?.dataset.treino;

  const name = li ? li.getAttribute("data-name") : null;

  if(btn.classList.contains("toggle-button")){
    const ul = treinoDiv.querySelector(".exercise-list");
    const hidden = ul.style.display === "none";
    ul.style.display = hidden ? "block" : "none";
    btn.textContent = hidden ? "–" : "+";
    return;
  }

  if(btn.classList.contains("reset-treino")){
    if(!confirm(`Resetar Treino ${treino}?`)) return;

    // Alteração: preservar observações & cargas — limpar apenas séries/reps/rest/done
    Object.keys(exercisesData).forEach(n => {
      if(exercisesData[n].treinos[treino]){
        const existingObs = exercisesData[n].treinos[treino].observations || exercisesData[n].treinos[treino].observacoes || "";
        exercisesData[n].treinos[treino] = {
          series:"", reps:"", rest:"", observations: existingObs
        };
      }
    });

    exerciseOrder[treino] = [];

    Object.keys(doneState)
      .filter(k => k.startsWith(treino+"::"))
      .forEach(k => delete doneState[k]);

    renderExercises();
    saveToFirestore();
    return;
  }

  if (!li || !name || !treino) return;

  if(!exercisesData[name]) exercisesData[name] = { treinos:{}, loads:[] };
  if(!Array.isArray(exercisesData[name].loads)) exercisesData[name].loads = [];

  const exData = exercisesData[name].treinos[treino];

  /* Concluído */
  if(btn.classList.contains("done-btn")){
    const key = treino + "::" + name;

    doneState[key] = !doneState[key];
    li.classList.toggle("done", doneState[key]);

    alertMsg("🏋️‍♂️ Exercício concluído. Lembre-se de adicionar suas cargas!");
    return;
  }

  /* Adicionar carga */
  if(btn.classList.contains("add-load")){
    const carga = prompt("Carga (kg):");
    if(carga){
      const date = new Date().toLocaleDateString();

      if(!Array.isArray(exercisesData[name].loads)) exercisesData[name].loads = [];
      exercisesData[name].loads.unshift(`${carga} kg – ${date}`);
      exercisesData[name].loads = exercisesData[name].loads.slice(0,5);

      renderExercises();
      saveToFirestore();
    }
    return;
  }

  /* Remover carga */
  if(btn.classList.contains("remove-load")){
    if(Array.isArray(exercisesData[name].loads) && exercisesData[name].loads.length){
      exercisesData[name].loads.shift();
    }
    renderExercises();
    saveToFirestore();
    return;
  }

  /* Editar carga */
  if(btn.classList.contains("edit-load")){
    if(!Array.isArray(exercisesData[name].loads) || !exercisesData[name].loads.length){
      alert("Nenhuma carga!");
      return;
    }

    const atual = String(exercisesData[name].loads[0]).split(" ")[0];
    const nova = prompt("Editar carga:", atual);
    if(nova){
      const date = new Date().toLocaleDateString();
      exercisesData[name].loads[0] = `${nova} kg – ${date}`;
      renderExercises();
      saveToFirestore();
    }
    return;
  }

  if(btn.classList.contains("edit-options")){
    const menu = li.querySelector(".edit-menu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    return;
  }

  if(btn.classList.contains("edit-all")){
    currentEditExercise = name;
    currentEditTreino = treino;

    document.getElementById("editName").value = name;
    document.getElementById("editSeries").value = exData.series;
    document.getElementById("editReps").value = exData.reps;
    document.getElementById("editRest").value = exData.rest;

    editModal.classList.add("show");
    return;
  }

  if(btn.classList.contains("delete-exercise")){
    if(!confirm(`Remover ${name} do Treino ${treino}?`)) return;

    delete exercisesData[name].treinos[treino];
    exerciseOrder[treino] =
      exerciseOrder[treino].filter(n => n !== name);

    if(Object.keys(exercisesData[name].treinos).length === 0)
      delete exercisesData[name];

    Object.keys(doneState)
      .filter(k => k.endsWith("::"+name))
      .forEach(k => delete doneState[k]);

    renderExercises();
    saveToFirestore();
  }
}

function renderExercises(){
  treinos.forEach(t => {
    const ul = document.querySelector(`.accordion-item[data-treino="${t}"] .exercise-list`);
    ul.innerHTML = "";

    const order = exerciseOrder[t] || [];
    order.forEach(name => {
      const ex = exercisesData[name]?.treinos[t];
      if(!ex) return;

      const li = document.createElement("li");
      li.dataset.name = name;

      const key = t + "::" + name;
      if (doneState[key]) li.classList.add("done");

      li.innerHTML = `
        <div>${name}</div>
        <div class="exercise-info">
          Séries: ${ex.series} | Repetições: ${ex.reps} | Descanso: ${ex.rest}
        </div>

        <ul class="loads-list"></ul>

        <div class="exercise-buttons">
          <button class="add-load">Adicionar Carga</button>
          <button class="edit-options">Editar</button>
          <button class="remove-load">Remover Carga</button>
          <button class="delete-exercise">Remover Exercício</button>
          <button class="done-btn">Concluído</button>
        </div>

        <div class="edit-menu">
          <button class="edit-load">Editar Carga</button>
          <button class="edit-all">Editar Informações</button>
        </div>

        <textarea class="observation" placeholder="Observações...">${ex.observations || ""}</textarea>
      `;

      ul.appendChild(li);

      const loadsUl = li.querySelector(".loads-list");
      const loadsArray = Array.isArray(exercisesData[name].loads) ? exercisesData[name].loads : [];
      loadsArray.forEach(l => {
        const liLoad = document.createElement("li");
        liLoad.textContent = l;
        loadsUl.appendChild(liLoad);
      });

      li.querySelector(".observation").addEventListener("input", e => {
        ex.observations = e.target.value;
        saveToFirestore();
      });
    });
  });

  atualizarListaSelecao();
  enableDragDrop();
}

function enableDragDrop(){
  const isTouch = "ontouchstart" in window;

  treinos.forEach(t => {
    const ul = document.querySelector(`.accordion-item[data-treino="${t}"] .exercise-list`);
    if(!ul) return;

    new Sortable(ul, {
      animation:150,
      delay: isTouch ? 300 : 0,
      delayOnTouchOnly:true,
      touchStartThreshold:10,
      onEnd: () => {
        exerciseOrder[t] =
          Array.from(ul.children).map(li => li.dataset.name);
        saveToFirestore();
      }
    });
  });
}

function atualizarListaSelecao(){
  const select = document.getElementById("exerciseSelect");

  select.innerHTML = `
    <option value="">Selecione...</option>
    <option value="add">+ Adicionar novo exercício</option>
  `;

  Object.keys(exercisesData).sort().forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
}

async function saveToFirestore(){
  try{
    await db.collection("users").doc("defaultUser").set({
      exercises: exercisesData,
      order: exerciseOrder
    });
  } catch(e){
    console.error("Erro ao salvar:", e);
  }
}

async function loadFromFirestore(){
  try{
    const doc = await db.collection("users").doc("defaultUser").get();

    if(doc.exists){
      const data = doc.data();
      exercisesData = data.exercises || {};
      exerciseOrder = data.order || {};
    } else {
      exercisesData = {};
      exerciseOrder = {};
    }

    treinos.forEach(t => {
      if(!exerciseOrder[t]) exerciseOrder[t] = [];
    });

    Object.keys(exercisesData).forEach(name => {
      if(!Array.isArray(exercisesData[name].loads)) exercisesData[name].loads = [];
      if(!exercisesData[name].treinos) exercisesData[name].treinos = {};
    });

    renderExercises();

  } catch(e){
    console.error("Erro ao carregar:", e);
  }
}

function alertMsg(msg){
  alertDiv.textContent = msg;
  alertDiv.classList.add("show");
  setTimeout(() => alertDiv.classList.remove("show"), 2500);
}
</script>
